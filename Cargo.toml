[package]
name = "mcpg-config"
version = "0.1.0-beta.20"
edition = "2024"
license = "Apache-2.0"
description = "Configuration toolchain for the MCP Gateway: generate starter configs from curated deployment shapes, validate against the gateway's real schema, explain effective wiring, scan for inline secrets, and emit the JSON schema. The `mcpg config <sub>` subcommand delegates here."

[dependencies]
# The gateway AS A LIBRARY: this tool validates and explains against the
# gateway's real AppConfig — same deserialiser, same deny_unknown_fields —
# so a config this tool accepts is a config the gateway boots.
mcpg = { git = "https://github.com/mcpg-dev/mcpg", tag = "v0.1.0-beta.23", version = "=0.1.0-beta.23" }

clap = { version = "4", features = ["derive", "env", "wrap_help"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = { version = "0.8", default-features = false, features = ["derive", "preserve_order"] }

[dev-dependencies]
jsonschema = "0.28"
tempfile = "3"
